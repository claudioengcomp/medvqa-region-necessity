run_name: blip_lora_pathvqa
model: BLIP
dataset: PATH_VQA
peft: LORA
peft_config:
  r: 8
  lora_alpha: 16
  target_modules: [q_proj, k_proj, v_proj, out_proj]
train:
  lr: 2e-4
  warmup_ratio: 0.05
  epochs: 3
  batch_size: 8
  grad_accum_steps: 4
  max_length: 192
  gradient_checkpointing: true
  compile: true
  eval_every: 5000
  checkpoint_every: 5000
eval:
  batch_size: 8
  split: test
  max_new_tokens: 16
logging:
  wandb_project: "med-vlm"
  wandb_run_name: "blip_lora_pathvqa"
outputs_dir: "./outputs"

# Image preprocessing applied once at dataset load (cached).
# All options default to false — enable to experiment.
preprocessing:
  denoise: true
  denoise_method: "gaussian" # "gaussian" (mild) or "bilateral" (edge-preserving)
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]

# Online training-time augmentation (applied per batch, training only).
# No flips — intentionally omitted to preserve laterality answers.
augmentation:
  enabled: true
  rotation_degrees: 5
  brightness_range: [0.85, 1.15]
  contrast_range: [0.85, 1.15]
