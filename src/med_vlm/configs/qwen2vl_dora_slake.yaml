run_name: qwen2vl_dora_slake
model: QWEN2VL
dataset: SLAKE
peft: DORA
peft_config:
  r: 16
  lora_alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  task_type: CAUSAL_LM
train:
  lr: 2e-4
  warmup_ratio: 0.05
  epochs: 3
  batch_size: 4
  grad_accum_steps: 8
  max_length: 2048
  gradient_checkpointing: true
  compile: true
  eval_every: 5000
  checkpoint_every: 5000
eval:
  batch_size: 4
  split: test
  max_new_tokens: 64
logging:
  wandb_project: "med-vlm"
  wandb_run_name: "qwen2vl_dora_slake"
outputs_dir: "./outputs"

# Image preprocessing applied once at dataset load (cached).
# All options default to false — enable to experiment.
preprocessing:
  denoise: true
  denoise_method: "gaussian" # "gaussian" (mild) or "bilateral" (edge-preserving)
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]

# Online training-time augmentation (applied per batch, training only).
# No flips — intentionally omitted to preserve laterality answers.
augmentation:
  enabled: true
  rotation_degrees: 5
  brightness_range: [0.85, 1.15]
  contrast_range: [0.85, 1.15]
