# LLaVA-Med — zero-shot evaluation only. No fine-tuning is performed; the model is evaluated directly on the test split.
run_name: llava_med_zeroshot_pathvqa
model: LLAVA_MED
dataset: PATH_VQA
peft: NONE
zero_shot: true
eval:
  batch_size: 1
  split: test
  max_new_tokens: 64
logging:
  wandb_project: "med-vlm"
  wandb_run_name: "llava_med_zeroshot_pathvqa"
outputs_dir: "./outputs"

# Image preprocessing applied once at dataset load (cached).
# All options default to false — enable to experiment.
preprocessing:
  denoise: true
  denoise_method: "gaussian" # "gaussian" (mild) or "bilateral" (edge-preserving)
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]
