# Environment used for fine-tuning and inference of Qwen2-VL-2B and SmolVLM2-2.2B (LoRA/DoRA), the zero-shot models and the analysis.
# torch 2.13.0 built for CUDA 13.0 (NVIDIA driver 580.178.04); install the matching wheel for your CUDA from https://pytorch.org.
# The complete pip freeze of the original environment is in pip-freeze-full.txt.
name: medvqa-rn
channels: [conda-forge]
dependencies:
  - python=3.13.15
  - pip
  - pip:
      - -r requirements.txt
