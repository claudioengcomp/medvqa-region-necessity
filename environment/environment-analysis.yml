# Minimal environment for the CPU-only reproduction (reproduce.sh): numbers sheet, tables, figure, Kvasir-VQA-x1 per-run statistics.
name: medvqa-rn-analysis
channels: [conda-forge]
dependencies:
  - python=3.13
  - pip
  - pip:
      - numpy==2.5.2
      - scipy==1.18.1
      - pandas==3.0.5
      - pyarrow==25.0.1
      - matplotlib==3.11.1
      - pillow==12.3.0
      - PyYAML==6.0.3
