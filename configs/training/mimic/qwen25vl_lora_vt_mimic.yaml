# Qwen2.5-VL-7B LoRA (2026-10-23): copy of qwen2vl_lora_vt_mimic.yaml (sha256 b5fd6378d1869b4b); only model (QWEN25VL = Qwen/Qwen2.5-VL-7B-Instruct), run_name/wandb_run_name, outputs_dir, results_json_dir and train.checkpoint_dir change.
run_name: qwen25vl_lora_vt_mimic
model: QWEN25VL
dataset: MIMIC
peft: LORA
peft_config:
  r: 16
  lora_alpha: 32
  target_modules: .*self_attn\.(q|k|v|o)_proj$|.*visual\.blocks\.\d+\.attn\.(qkv|proj)$
  task_type: CAUSAL_LM
train:
  lr: 2e-4
  warmup_ratio: 0.05
  epochs: 3
  batch_size: 4
  grad_accum_steps: 4
  max_length: 8192
  gradient_checkpointing: true
  compile: true
  eval_every: 5000
  checkpoint_every: 15000
  checkpoint_dir: ${OUTPUT_ROOT}/mimic/checkpoints
eval:
  batch_size: 2
  max_new_tokens: 64
logging:
  wandb_project: med-vlm
  wandb_run_name: qwen25vl_lora_vt_mimic
outputs_dir: ${OUTPUT_ROOT}/mimic
results_json_dir: ${OUTPUT_ROOT}/mimic/logs
preprocessing:
  denoise: true
  denoise_method: gaussian
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size:
  - 8
  - 8
augmentation:
  enabled: true
  rotation_degrees: 5
  brightness_range:
  - 0.85
  - 1.15
  contrast_range:
  - 0.85
  - 1.15
