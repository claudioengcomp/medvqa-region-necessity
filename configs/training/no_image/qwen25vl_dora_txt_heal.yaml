# Qwen2.5-VL-7B DoRA (27/10/2026): copy of qwen25vl_lora_txt_heal.yaml (sha256 6c96c62511a3c4a5) with LoRA replaced by DoRA (peft), run names and output directories changed, and without checkpoint_every (final adapter only).
run_name: qwen25vl_dora_txt_heal
model: QWEN25VL
dataset: HEAL
peft: DORA
peft_config:
  r: 16
  lora_alpha: 32
  target_modules: ^.*model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj$
  task_type: CAUSAL_LM
data:
  no_image: true
train:
  lr: 2e-4
  warmup_ratio: 0.05
  epochs: 3
  batch_size: 4
  grad_accum_steps: 4
  max_length: 1024
  gradient_checkpointing: true
  compile: true
  eval_every: 5000
  checkpoint_dir: ${OUTPUT_ROOT}/no_image_dora/checkpoints
eval:
  batch_size: 2
  max_new_tokens: 64
logging:
  wandb_project: med-vlm
  wandb_run_name: qwen25vl_dora_txt_heal
outputs_dir: ${OUTPUT_ROOT}/no_image_dora
results_json_dir: ${OUTPUT_ROOT}/no_image_dora/logs
preprocessing:
  denoise: true
  denoise_method: gaussian
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size:
  - 8
  - 8
augmentation:
  enabled: true
  rotation_degrees: 5
  brightness_range:
  - 0.85
  - 1.15
  contrast_range:
  - 0.85
  - 1.15
