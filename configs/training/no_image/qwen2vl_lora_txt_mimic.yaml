# v7_mimic (2026-10-10): copy of v7_txt/configs/qwen2vl_lora_txt_heal.yaml (no-image baseline arm; LoRA on the LM only; max_length 1024), changing only dataset: MIMIC, run_name/wandb_run_name and the output paths.
run_name: qwen2vl_lora_txt_mimic
model: QWEN2VL
dataset: MIMIC
peft: LORA
peft_config:
  r: 16
  lora_alpha: 32
  target_modules: ^.*model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj$
  task_type: CAUSAL_LM
data:
  no_image: true
train:
  lr: 2e-4
  warmup_ratio: 0.05
  epochs: 3
  batch_size: 4
  grad_accum_steps: 4
  max_length: 1024
  gradient_checkpointing: true
  compile: true
  eval_every: 5000
  checkpoint_every: 15000
  checkpoint_dir: ${OUTPUT_ROOT}/no_image/checkpoints
eval:
  batch_size: 2
  max_new_tokens: 64
logging:
  wandb_project: "med-vlm"
  wandb_run_name: "qwen2vl_lora_txt_mimic"
outputs_dir: ${OUTPUT_ROOT}/no_image
results_json_dir: ${OUTPUT_ROOT}/no_image/logs

# Image preprocessing applied once at dataset load (cached).
preprocessing:
  denoise: true
  denoise_method: "gaussian"
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]

# Online training-time augmentation (applied per batch, training only). No flips.
augmentation:
  enabled: true
  rotation_degrees: 5
  brightness_range: [0.85, 1.15]
  contrast_range: [0.85, 1.15]
