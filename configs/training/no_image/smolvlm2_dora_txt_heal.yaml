# round 17 (22/10/2026): copy of smolvlm2_lora_txt_heal.yaml, changing only LoRA -> DoRA (peft), names, output folders, and no checkpoint_every (disk space).
# v7_txt (2026-10-09): no-image baseline arm -- copy of the YAML of the reference frozen-tower run
# (smolvlm2_lora_ft_* (LM fine-tuning regex, v6_tower_heal) over med_vlm/configs/smolvlm2_lora_heal.yaml),
# changing only: data.no_image, peft_config.target_modules (LoRA on the language model only), train.max_length (8192/2048 -> 1024,
# no image tokens), checkpoint_every/checkpoint_dir (intermediate states in tmp/v7) and the output paths.
run_name: smolvlm2_dora_txt_heal
model: SMOLVLM
dataset: HEAL
peft: DORA
peft_config:
  r: 16
  lora_alpha: 32
  target_modules: ^.*text_model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj$
  task_type: CAUSAL_LM
data:
  no_image: true
train:
  lr: 2e-4
  warmup_ratio: 0.05
  epochs: 3
  batch_size: 4
  grad_accum_steps: 4
  max_length: 1024
  gradient_checkpointing: true
  compile: false
  eval_every: 5000
  checkpoint_dir: ${OUTPUT_ROOT}/no_image_dora/checkpoints
eval:
  batch_size: 2
  max_new_tokens: 64
logging:
  wandb_project: "med-vlm"
  wandb_run_name: "smolvlm2_dora_txt_heal"
outputs_dir: ${OUTPUT_ROOT}/no_image_dora
results_json_dir: ${OUTPUT_ROOT}/no_image_dora/logs

# Image preprocessing applied once at dataset load (cached). No effect under no_image (kept identical to the reference config).
preprocessing:
  denoise: true
  denoise_method: "gaussian"
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]

# Online training-time augmentation (applied per batch, training only). No effect under no_image.
augmentation:
  enabled: true
  rotation_degrees: 5
  brightness_range: [0.85, 1.15]
  contrast_range: [0.85, 1.15]
