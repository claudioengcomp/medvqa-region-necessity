# Paths used by the analysis scripts (src/analysis). Relative to the repository root; run the scripts from the root.
# This default configuration needs nothing beyond this repository: it reproduces the numbers sheet, the tables and the
# figure from results/analysis and recomputes the Kvasir-VQA-x1 per-run statistics from results/predictions.
out: results                      # analysis/, docs/, tables/, figs/, logs/, manifests/ are written under this root (override: MRN_OUT)
code_root: src                    # importable root for med_vlm and harness
lab_root: local/lab               # root of the original lab layout; only needed for the credentialed benchmarks (see config/paths.credentialed.example.yaml)
lab_inputs: local/lab/v7_artigo1/inputs
previous_sheets: results/previous_sheets
blur4_meta: data/blur4
kvasir:
  meta: data/kvasir
  occluder_meta: data/kvasir/occluder
  predictions:                    # per-item predictions on the occlusion test set and related conditions (search order)
    - results/predictions/kvasir/occlusion
    - results/predictions/kvasir/occlusion_encoder_swapped
    - results/predictions/kvasir/full_test_encoder_swapped
    - results/predictions/kvasir/full_test
    - results/predictions/kvasir/no_image
    - results/predictions/kvasir/occluder
  full_test_predictions:          # intact-image predictions on the whole test set (reference of the occluder test)
    - results/predictions/kvasir/full_test
    - results/predictions/kvasir/full_test_encoder_swapped
no_image_predictions: [results/predictions/kvasir/no_image]
no_image_dora_predictions: [results/predictions/kvasir/no_image_dora]
m3ae_no_image_predictions: [results/predictions/kvasir/no_image_m3ae]
zero_shot_predictions: [results/predictions/kvasir/zero_shot]
blur4_predictions: [results/predictions/kvasir/blur4]
qwen25vl_7b_predictions: []       # Qwen2.5-VL-7B runs: their Kvasir-VQA-x1 predictions are in the sub-directories above; extra directories only for the credentialed benchmarks (lab_qwen25vl_7b_predictions)
